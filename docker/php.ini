; Variabel environment dari Docker/hosting harus kebaca oleh Laravel
variables_order = "EGPCS"

; Upload gambar motor/mobil lewat panel Filament
upload_max_filesize = 12M
post_max_size = 12M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

expose_php = Off

; Cache PHP supaya respons lebih cepat di container
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
