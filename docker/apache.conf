# Virtual host Laravel.
# DocumentRoot diarahkan ke folder public/, jadi file .env & kode app
# tidak bisa diakses langsung dari browser.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hosting seperti Render/Railway menaruh HTTPS di depan container.
    # Baris ini bikin Laravel tahu koneksi aslinya HTTPS, supaya URL
    # asset dan redirect tidak jadi http (mixed content).
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
